name: DMS Operations Contracts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  operations-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile operations health check
        run: python -m py_compile scripts/dms_ops_healthcheck.py
      - name: Validate operator shell scripts
        run: |
          bash -n scripts/dms_ops_status.sh
          bash -n scripts/dms_ops_restart.sh
          bash -n scripts/dms_ops_logs.sh
      - name: Validate systemd and logrotate source contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          units = "\n".join(
              path.read_text()
              for path in sorted(Path("deploy/systemd").glob("*"))
          )
          for token in [
              "Restart=always",
              "OnFailure=dms-dashboard-recover.service",
              "OnActiveSec=90s",
              "PartOf=dms-dashboard.target",
              "@BENCH_NAME@",
              "@NODE_DIR@",
              "ExecStart=/usr/bin/systemctl restart dms-dashboard.target",
              "@BENCH_NAME@-frappe-schedule.service",
          ]:
              assert token in units, token

          health = Path("scripts/dms_ops_healthcheck.py").read_text()
          for token in [
              "dms.auth_setup.preflight_probe",
              "redis_cache",
              "redis_queue",
              "systemctl",
              "socket.io/?EIO=4&transport=polling",
          ]:
              assert token in health, token

          restart = Path("scripts/dms_ops_restart.sh").read_text()
          assert "seq 1 180" in restart
          assert "sleep 8" not in restart
          assert "socket.io/?EIO=4&transport=polling" in restart

          logrotate = Path("deploy/logrotate/dms-dashboard").read_text()
          assert "rotate 8" in logrotate
          assert "copytruncate" in logrotate
          assert "su root root" in logrotate
          print("DMS operations source contracts: PASS")
          PY

  frontend-production-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://dms.localhost:8000
